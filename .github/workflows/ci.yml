name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/full-platform-implementation
  workflow_dispatch:

# The workflow runs checks only; it has no deployment, service, or credential access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  repository-hygiene:
    name: Security & hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Node from package engines
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Check tracked repository hygiene
        run: node scripts/check-repository-hygiene.mjs

      - name: Verify Supabase schema and RLS guardrails
        run: node scripts/verify-supabase-schema.mjs

  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Node from package engines
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Scan browser bundle for server-only secret identifiers
        run: npm run check:bundle

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7

      - name: Set up Node from package engines
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install the pinned Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build

      - name: Run production browser tests
        run: PLAYWRIGHT_PRODUCTION=true npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
