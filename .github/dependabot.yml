version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-npm-updates:
        update-types:
          - minor
          - patch
    # Keep potentially breaking dependency upgrades as intentional, reviewed work.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible-action-updates:
        update-types:
          - minor
          - patch
